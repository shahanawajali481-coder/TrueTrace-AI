<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TrueTrace AI — Connection Unavailable</title>
  <style>
    body {
      background-color: #050811;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: #0a0f1d;
      border: 1px solid #1e2c4f;
      border-radius: 16px;
      padding: 40px;
      max-width: 480px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    h1 { font-size: 20px; color: #f8fafc; margin-bottom: 8px; }
    p { font-size: 13px; color: #94a3b8; line-height: 1.5; margin-bottom: 24px; }
    button {
      background: #3b82f6;
      border: none;
      color: white;
      padding: 10px 24px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size: 40px; margin-bottom: 12px;">🛡️</div>
    <h1>Backend Service Unreachable</h1>
    <p>
      TrueTrace AI requires an active connection to the verification engine (default: http://127.0.0.1:8000). Please ensure the backend server is running and try again.
    </p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
